<div class="min-h-screen flex items-center justify-center bg-ink py-12 px-4 sm:px-6 lg:px-8">
  <div class="w-full max-w-md bg-cream text-ink p-8 sm:p-10 space-y-8">
    <div>
      <a routerLink="/" class="font-display font-bold text-3xl tracking-[-0.04em]">Fit<span class="text-mute">Track</span></a>
      <h2 class="mt-6 font-display font-bold uppercase text-5xl leading-[0.95] tracking-[-0.02em]">
        Invest in <span class="text-mute">yourself.</span>
      </h2>
      <p class="mt-3 text-xs text-mute">Rejoins-nous pour commencer ton suivi sportif</p>
    </div>

    <div *ngIf="errorMessage" class="border border-red-600 text-red-700 text-xs p-3">
      {{ errorMessage }}
    </div>

    <form class="space-y-6" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="space-y-5">
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-[0.18em] mb-2">Adresse email</label>
          <input formControlName="email" type="email" required
            class="block w-full px-3 py-3 border border-ink/30 bg-transparent text-ink text-sm focus:outline-none focus:border-ink"
            placeholder="exemple@email.com">
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-[0.18em] mb-2">Mot de passe</label>
          <input formControlName="pass" type="password" required
            class="block w-full px-3 py-3 border border-ink/30 bg-transparent text-ink text-sm focus:outline-none focus:border-ink"
            placeholder="••••••••">
          <p class="mt-2 text-[10px] text-mute">8 caractères minimum</p>
        </div>
      </div>

      <button type="submit" [disabled]="registerForm.invalid || isLoading"
        class="w-full flex items-center justify-between h-[44px] px-4 bg-lime hover:brightness-95 text-ink text-xs font-bold disabled:opacity-50 transition">
        <span *ngIf="isLoading">Inscription en cours...</span>
        <span *ngIf="!isLoading">S'inscrire</span>
        <span>→</span>
      </button>

      <p class="text-center text-xs text-mute">
        Déjà un compte ?
        <a routerLink="/login" class="font-bold text-ink border-b border-ink">Connecte-toi</a>
      </p>
    </form>
  </div>
</div>
